          env:
            - name: POSTGRES_DB
              value: appointment_db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: clinic-db-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clinic-db-credentials
                  key: password
          volumeMounts:
            - name: data
