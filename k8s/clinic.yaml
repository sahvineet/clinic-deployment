---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doctor-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doctor-service
  template:
    metadata:
      labels:
        app: doctor-service
    spec:
      initContainers:
        - name: wait-for-database
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - until pg_isready -h doctor-db -p 5432 -U "$PGUSER" -d doctor_db; do sleep 2; done
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: clinic-db-credentials
                  key: username
      containers:
        - name: doctor-service
          image: clinic-doctor-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: PGHOST
              value: doctor-db
            - name: PGDATABASE
              value: doctor_db
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: clinic-db-credentials
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: clinic-db-credentials
                  key: password
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: doctor-service
spec:
  type: NodePort
  selector:
    app: doctor-service
  ports:
    - port: 3001
      targetPort: 3001
      nodePort: 30001
---
